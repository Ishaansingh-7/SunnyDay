<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { margin: 0; background: #fff; font-family: 'Public Sans', 'Segoe UI', Arial, sans-serif; }
  svg text { font-family: inherit; }
  .t { font-size: 16px; font-weight: 700; fill: #17233b; }
  .s { font-size: 12.5px; fill: #3e4c66; }
  .m { font-size: 11.5px; fill: #66748b; }
  .lab { font-size: 11.5px; fill: #3e4c66; }
  .ar { stroke: #3e4c66; stroke-width: 1.8; fill: none; }
  .dash { stroke-dasharray: 5 4; }
</style>
</head>
<body>
<svg width="1200" height="720" viewBox="0 0 1200 720" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10z" fill="#3e4c66"/>
    </marker>
  </defs>
  <rect width="1200" height="720" fill="#ffffff"/>

  <rect x="240" y="56" width="730" height="640" rx="18" fill="#f3f6fa" stroke="#c9d3e0" stroke-dasharray="6 5"/>
  <text x="262" y="86" font-size="16" font-weight="700" fill="#17233b">AWS Cloud · ap-south-1 (Mumbai)</text>
  <text x="262" y="106" class="m">One CloudFormation stack from template.yaml (AWS SAM)</text>

  <!-- user side -->
  <rect x="24" y="250" width="180" height="120" rx="14" fill="#17233b"/>
  <text x="114" y="292" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">User's browser</text>
  <text x="114" y="314" text-anchor="middle" font-size="12.5" fill="#c9d3e0">React single-page app</text>
  <text x="114" y="334" text-anchor="middle" font-size="12.5" fill="#c9d3e0">animations, charts,</text>
  <text x="114" y="352" text-anchor="middle" font-size="12.5" fill="#c9d3e0">climate statistics</text>

  <rect x="24" y="580" width="180" height="80" rx="14" fill="#fff" stroke="#17233b" stroke-width="2"/>
  <text x="114" y="614" text-anchor="middle" class="t">User's inbox</text>
  <text x="114" y="636" text-anchor="middle" class="s">weather emails</text>

  <!-- AWS services -->
  <rect x="290" y="130" width="210" height="96" rx="14" fill="#fff" stroke="#8a5cd6" stroke-width="2"/>
  <text x="395" y="164" text-anchor="middle" class="t">Amazon CloudFront</text>
  <text x="395" y="186" text-anchor="middle" class="s">HTTPS, global CDN</text>
  <text x="395" y="206" text-anchor="middle" class="m">/ to S3 · /api/* to Lambda</text>

  <rect x="700" y="130" width="230" height="84" rx="14" fill="#fff" stroke="#1e8a4c" stroke-width="2"/>
  <text x="815" y="164" text-anchor="middle" class="t">Amazon S3</text>
  <text x="815" y="186" text-anchor="middle" class="s">private bucket, site file</text>
  <text x="815" y="204" text-anchor="middle" class="m">read only by CloudFront</text>

  <rect x="290" y="300" width="210" height="100" rx="14" fill="#fff" stroke="#d4572a" stroke-width="2"/>
  <text x="395" y="334" text-anchor="middle" class="t">Amazon Cognito</text>
  <text x="395" y="356" text-anchor="middle" class="s">sign-up, sign-in,</text>
  <text x="395" y="374" text-anchor="middle" class="s">6-digit email verification</text>

  <rect x="640" y="290" width="290" height="130" rx="14" fill="#fff" stroke="#eb6834" stroke-width="2"/>
  <text x="785" y="324" text-anchor="middle" class="t">AWS Lambda (Python 3.12)</text>
  <text x="785" y="346" text-anchor="middle" class="s">accounts API: settings, test email,</text>
  <text x="785" y="364" text-anchor="middle" class="s">delete account, unsubscribe</text>
  <text x="785" y="384" text-anchor="middle" class="s">scheduled run: who is due, build email</text>
  <text x="785" y="404" text-anchor="middle" class="m">Function URL · arm64 · 256 MB</text>

  <rect x="700" y="560" width="230" height="90" rx="14" fill="#fff" stroke="#2a78d6" stroke-width="2"/>
  <text x="815" y="594" text-anchor="middle" class="t">Amazon DynamoDB</text>
  <text x="815" y="616" text-anchor="middle" class="s">users table: city, schedule,</text>
  <text x="815" y="634" text-anchor="middle" class="s">alerts, last sent</text>

  <rect x="470" y="470" width="190" height="84" rx="14" fill="#fff" stroke="#c98500" stroke-width="2"/>
  <text x="565" y="502" text-anchor="middle" class="t">EventBridge Scheduler</text>
  <text x="565" y="524" text-anchor="middle" class="s">every 30 minutes</text>
  <text x="565" y="542" text-anchor="middle" class="m">{"action": "digest"}</text>

  <rect x="290" y="580" width="190" height="80" rx="14" fill="#fff" stroke="#3fae5a" stroke-width="2"/>
  <text x="385" y="614" text-anchor="middle" class="t">Amazon SES</text>
  <text x="385" y="636" text-anchor="middle" class="s">sends HTML emails</text>

  <!-- external -->
  <rect x="1000" y="290" width="180" height="150" rx="14" fill="#fff" stroke="#17233b" stroke-width="2"/>
  <text x="1090" y="326" text-anchor="middle" class="t">Open-Meteo APIs</text>
  <text x="1090" y="350" text-anchor="middle" class="s">forecast models</text>
  <text x="1090" y="370" text-anchor="middle" class="s">ERA5 climate archive</text>
  <text x="1090" y="390" text-anchor="middle" class="s">geocoding, air quality</text>
  <text x="1090" y="414" text-anchor="middle" class="m">free, no API key</text>

  <!-- arrows -->
  <path class="ar" d="M204 280 C240 260 255 200 286 186" marker-end="url(#a)"/>
  <text x="150" y="216" class="lab">load site, /api calls</text>
  <path class="ar" d="M500 172 H696" marker-end="url(#a)"/>
  <text x="598" y="164" text-anchor="middle" class="lab">site file</text>
  <path class="ar" d="M480 226 C560 260 590 300 636 320" marker-end="url(#a)"/>
  <text x="556" y="270" class="lab">/api/*</text>
  <path class="ar" d="M204 330 H286" marker-end="url(#a)"/>
  <text x="212" y="322" class="lab">sign in</text>
  <path class="ar" d="M114 250 V30 H1090 V286" marker-end="url(#a)"/>
  <text x="620" y="24" text-anchor="middle" class="lab">forecasts, 40 years of daily climate data and city search, fetched directly by the browser</text>
  <path class="ar dash" d="M640 360 H504" marker-end="url(#a)"/>
  <text x="572" y="352" text-anchor="middle" class="lab">check token</text>
  <path class="ar" d="M930 340 H996" marker-end="url(#a)"/>
  <text x="963" y="332" text-anchor="middle" class="lab">weather</text>
  <path class="ar" d="M815 420 V556" marker-end="url(#a)" marker-start="url(#a)"/>
  <text x="826" y="492" class="lab">read / write settings</text>
  <path class="ar" d="M660 500 C690 470 700 450 712 424" marker-end="url(#a)"/>
  <text x="664" y="458" class="lab">invoke</text>
  <path class="ar" d="M640 404 C520 412 400 460 396 576" marker-end="url(#a)"/>
  <text x="452" y="440" class="lab">send email</text>
  <path class="ar" d="M290 620 H208" marker-end="url(#a)"/>
  <text x="249" y="612" text-anchor="middle" class="lab">deliver</text>
</svg>
</body>
</html>
